services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Nome explícito: o `e2e-app` reutiliza esta imagem (independe do nome do projeto compose).
    image: order-web-app
    container_name: wl_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
      redis:
        condition: service_healthy
    # php-fpm escuta em 9000; `nc` vem do busybox da imagem alpine (nao exige rebuild).
    # Permite ao nginx esperar o fpm aceitar conexoes (evita 502 na janela de boot).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - wl

  nginx:
    image: nginx:1.27-alpine
    container_name: wl_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - wl

  db:
    image: postgres:16-alpine
    container_name: wl_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: wl
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
    volumes:
      - wl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wl -d wl"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wl

  # Banco EXCLUSIVO da suíte de testes automatizados.
  #
  # Precisa ser separado do `db` porque os testes usam RefreshDatabase, que
  # roda migrate:fresh / trunca as tabelas a cada classe de teste. Apontar a
  # suíte para o `db` destruiria os dados de demonstração (CarolDocesDemoSeeder).
  #
  # O datadir vive em tmpfs (RAM): os dados são 100% descartáveis e isso remove
  # o I/O de disco, que é o gargalo do RefreshDatabase. Junto com os flags
  # `fsync=off` / `synchronous_commit=off` / `full_page_writes=off` — seguros
  # aqui justamente porque perder o banco após um crash é irrelevante — a suíte
  # fica bem mais rápida sem abrir mão de rodar no PostgreSQL 16 real.
  db_test:
    image: postgres:16-alpine
    container_name: wl_db_test
    ports:
      # Porta de host distinta do `db` (5433) para os dois coexistirem.
      - "5434:5432"
    environment:
      POSTGRES_DB: wl_test
      POSTGRES_USER: wl_test
      POSTGRES_PASSWORD: wl_test
      # Acelera o initdb do container efêmero.
      POSTGRES_INITDB_ARGS: "--nosync"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wl_test -d wl_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wl

  redis:
    image: redis:7-alpine
    container_name: wl_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wl

  mailpit:
    image: axllent/mailpit:latest
    container_name: wl_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wl

  # --- E2E (Playwright, item E4.5) -------------------------------------------------------------
  # Servidor ISOLADO para os testes de navegador. Só sobe com `--profile e2e` (o `docker compose up`
  # normal não o inicia). Fica na rede `wl`, mas:
  #   - fala com o banco `wl_e2e` DENTRO do `db_test` (tmpfs, descartável). NUNCA com `wl` (demo
  #     da Carol Doces) nem com `wl_test` (RefreshDatabase da suíte PHP);
  #   - não é o `nginx` da 8080: é `php -S` na 8000 (publicada em 8081);
  #   - uploads (storage/app/public e o livewire-tmp em storage/app/private), logs e cache de framework do
  #     E2E ficam em tmpfs: não sujam o storage do desenvolvimento e não dependem do dono dos arquivos
  #     no host (no runner do CI o uid difere do `www` do container);
  #   - SEM relógio congelado: o servidor roda com a data real (ver o porquê em src/e2e/support/fixtures.ts).
  # Orquestração completa: `npm run e2e` (src/) => bin/e2e.sh.
  e2e-app:
    profiles: ["e2e"]
    image: order-web-app
    pull_policy: never
    container_name: wl_e2e_app
    # O roteador do Laravel (server.php) espera o cwd em public/, como o `artisan serve`.
    # Para `artisan`, use `exec -w /var/www/html`.
    working_dir: /var/www/html/public
    command:
      - php
      - -S
      - 0.0.0.0:8000
      - ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    ports:
      - "8081:8000"
    volumes:
      - ./src:/var/www/html
    tmpfs:
      - /var/www/html/storage/app/public:mode=1777
      - /var/www/html/storage/app/private:mode=1777
      - /var/www/html/storage/logs:mode=1777
      - /var/www/html/storage/framework/cache:mode=1777
      - /var/www/html/storage/framework/views:mode=1777
      - /var/www/html/storage/framework/sessions:mode=1777
    environment:
      PHP_MEMORY_LIMIT: 512M
      PHP_CLI_SERVER_WORKERS: "4"
      APP_NAME: "Order Web E2E"
      APP_ENV: e2e
      APP_DEBUG: "false"
      # Chave descartável, só do E2E (cifra o que o E2E grava em settings; nada de produção).
      APP_KEY: "base64:ZTJlLW9yZGVyLXdlYi1wbGF5d3JpZ2h0LWtleS0wMDE="
      APP_URL: "http://e2e-app:8000"
      DB_CONNECTION: pgsql
      DB_HOST: db_test
      DB_PORT: "5432"
      DB_DATABASE: wl_e2e
      DB_USERNAME: wl_test
      DB_PASSWORD: wl_test
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      BCRYPT_ROUNDS: "4"
      FILESYSTEM_DISK: local
    depends_on:
      db_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - wl

networks:
  wl:

volumes:
  wl_pg_data: