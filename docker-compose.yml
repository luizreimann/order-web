services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wl_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      - db
      - redis
    networks:
      - wl

  nginx:
    image: nginx:1.27-alpine
    container_name: wl_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wl

  db:
    image: postgres:16-alpine
    container_name: wl_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: wl
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
    volumes:
      - wl_pg_data:/var/lib/postgresql/data
    networks:
      - wl

  redis:
    image: redis:7-alpine
    container_name: wl_redis
    ports:
      - "6379:6379"
    networks:
      - wl

  mailpit:
    image: axllent/mailpit:latest
    container_name: wl_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wl

networks:
  wl:

volumes:
  wl_pg_data: